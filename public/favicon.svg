<!--
  The airtel mark, as the browser tab.

  The swoosh alone on the app icon's red, not the full lockup that
  src/ui/icons/AirtelAppIcon.tsx draws beside a notification: a favicon is
  painted at 16px, and at 16px the "airtel" wordmark under the swoosh is a
  smudge that makes the whole tile unreadable. The swoosh survives the size,
  which is why app icons are drawn this way in the first place.

  Path geometry is AirtelMark's, scaled to fill the tile. Colours are literal
  rather than tokens: a favicon is fetched as its own document and never sees
  the app's stylesheet.
-->
