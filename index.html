<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="International roaming Travel Mode flow — clickable prototype generated from the Figma source." />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) report real
         numbers; without it the notch insets are always 0 and the full-bleed
         layout has nothing to pad against. Pinch zoom is left alone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Added to a home screen, this runs without browser chrome — which is
         also when the device draws its own status bar, so app.css drops the
         one the design paints. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Travel Mode" />
    <title>Airtel Travel Mode — prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
